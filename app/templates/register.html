{% extends "base.html" %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
  <div class="card">
    <h2 style="font-size: 1.4rem; text-align: center;">{{ t('nav_register', locale) }}</h2>
    
    <div id="reg-error" style="display: none; background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 0.5rem; border-radius: 6px; font-size: 0.85rem;"></div>

    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Username (used for ladder login)</label>
        <input type="text" id="reg-username" class="form-input" placeholder="e.g. yonas_eth" required>
      </div>

      <div class="form-group">
        <label>Display Name (shown on Passport & Bracket)</label>
        <input type="text" id="reg-display-name" class="form-input" placeholder="e.g. Yonas Solomon" required>
      </div>

      <div class="form-group">
        <label>{{ t('label_city', locale) }}</label>
        <select id="reg-city" class="form-select">
          <option value="Addis Ababa" selected>Addis Ababa</option>
          <option value="Hawassa">Hawassa</option>
          <option value="Adama">Adama</option>
          <option value="Bahir Dar">Bahir Dar</option>
          <option value="Dire Dawa">Dire Dawa</option>
        </select>
      </div>

      <div class="form-group">
        <label>{{ t('btn_switch_language', locale) }}</label>
        <select id="reg-lang" class="form-select">
          <option value="en" {% if locale == 'en' %}selected{% endif %}>English 🇬🇧</option>
          <option value="am" {% if locale == 'am' %}selected{% endif %}>አማርኛ 🇪🇹</option>
          <option value="om" {% if locale == 'om' %}selected{% endif %}>Afaan Oromoo 🇪🇹</option>
        </select>
      </div>

      <div class="form-group">
        <label>Password (optional in demo)</label>
        <input type="password" id="reg-password" class="form-input" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">{{ t('nav_register', locale) }}</button>
    </form>

    <div style="text-align: center; margin-top: 0.75rem; font-size: 0.85rem;">
      Already have an account? <a href="/login" style="color: var(--accent-gold); font-weight: bold;">{{ t('nav_login', locale) }}</a>
    </div>
  </div>
</div>

<script>
async function handleRegister(e) {
  e.preventDefault();
  const username = document.getElementById('reg-username').value;
  const display_name = document.getElementById('reg-display-name').value;
  const city = document.getElementById('reg-city').value;
  const language = document.getElementById('reg-lang').value;
  const password = document.getElementById('reg-password').value;

  const errBox = document.getElementById('reg-error');
  errBox.style.display = 'none';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, display_name, city, language, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errBox.innerText = data.detail || 'Registration failed';
      errBox.style.display = 'block';
    } else {
      window.location = '/dashboard';
    }
  } catch (err) {
    errBox.innerText = 'Network error during registration';
    errBox.style.display = 'block';
  }
}
</script>
{% endblock %}

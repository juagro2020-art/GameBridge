{% extends "base.html" %}

{% block content %}
<div style="max-width: 450px; margin: 2rem auto;">
  <div class="card">
    <h2 style="font-size: 1.4rem; text-align: center;">{{ t('nav_login', locale) }}</h2>
    
    <div id="login-error" style="display: none; background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 0.5rem; border-radius: 6px; font-size: 0.85rem;"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" class="form-input" placeholder="e.g. desta_k or captain_bole" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">{{ t('nav_login', locale) }}</button>
    </form>

    <div style="text-align: center; margin-top: 0.5rem; font-size: 0.85rem;">
      Don't have an account? <a href="/register" style="color: var(--accent-gold); font-weight: bold;">{{ t('nav_register', locale) }}</a>
    </div>

    <!-- Quick Judge Evaluation Logins -->
    <div style="margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; text-align: center;">⚡ Quick Evaluation Logins:</p>
      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <button onclick="quickLogin('desta_k', 'player123')" class="btn btn-outline btn-sm">
          👤 Competitor: desta_k (Bronze 1540 Elo)
        </button>
        <button onclick="quickLogin('captain_bole', 'captain123')" class="btn btn-outline btn-sm">
          🛡️ Hub Captain: Dawit (Bole Hub)
        </button>
        <button onclick="quickLogin('admin', 'admin123')" class="btn btn-outline btn-sm">
          ⚙️ Super Admin: Admin
        </button>
      </div>
    </div>
  </div>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const uname = document.getElementById('username').value;
  const pwd = document.getElementById('password').value;
  submitAuth(uname, pwd);
}

function quickLogin(uname, pwd) {
  submitAuth(uname, pwd);
}

async function submitAuth(username, password) {
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errBox.innerText = data.detail || 'Login failed';
      errBox.style.display = 'block';
    } else {
      if (data.role === 'hub_captain') {
        window.location = '/captain';
      } else {
        window.location = '/dashboard';
      }
    }
  } catch (err) {
    errBox.innerText = 'Network connection error';
    errBox.style.display = 'block';
  }
}
</script>
{% endblock %}
